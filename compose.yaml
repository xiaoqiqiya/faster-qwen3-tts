services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    gpus: all
    shm_size: 8gb
    environment:
      TTS_MODEL: ${TTS_MODEL:-/models/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      TTS_MODEL_REVISION: ${TTS_MODEL_REVISION:-main}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-}
      TTS_VOICES_FILE: ${TTS_VOICES_FILE:-/references/voices.json}
      TTS_MAX_CONCURRENT_TASKS: ${TTS_MAX_CONCURRENT_TASKS:-4}
      TTS_GPU_MEMORY_UTILIZATION: ${TTS_GPU_MEMORY_UTILIZATION:-0.3}
      TTS_MAX_NEW_TOKENS: ${TTS_MAX_NEW_TOKENS:-1024}
    volumes:
      - ${TTS_MODEL_HOST_DIR:-model-cache}:/models
      - ./references:/references:ro
      - backend-state:/state
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30m
    stop_grace_period: 30s

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_PORT:-8000}:8000"
    environment:
      TTS_BACKEND_URL: http://backend:8001
      TTS_BACKEND_STATE: /state/backend.json
      TTS_CACHE_DIR: /cache/audio
      TTS_MAX_CONCURRENT_TASKS: ${TTS_MAX_CONCURRENT_TASKS:-4}
      TTS_MAX_PENDING_TASKS: ${TTS_MAX_PENDING_TASKS:-8}
      TTS_CACHE_TTL_SECONDS: ${TTS_CACHE_TTL_SECONDS:-300}
      TTS_CACHE_MAX_MB: ${TTS_CACHE_MAX_MB:-256}
      TTS_MAX_READERS: ${TTS_MAX_READERS:-256}
      TTS_TASK_TIMEOUT_SECONDS: ${TTS_TASK_TIMEOUT_SECONDS:-120}
      TTS_SEND_TIMEOUT_SECONDS: ${TTS_SEND_TIMEOUT_SECONDS:-15}
      TTS_CACHE_CLEANUP_SECONDS: ${TTS_CACHE_CLEANUP_SECONDS:-5}
    volumes:
      - ${TTS_CACHE_HOST_DIR:-./cache}:/cache
      - backend-state:/state:ro
    healthcheck:
      test: ["CMD", "/gateway", "healthcheck"]
      interval: 10s
      timeout: 9s
      retries: 3
    stop_grace_period: 15s

volumes:
  model-cache:
  backend-state:
