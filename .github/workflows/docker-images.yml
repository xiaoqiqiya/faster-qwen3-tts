name: Docker images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docker-images.yml
      - .dockerignore
      - compose*.yaml
      - deploy/Dockerfile.*
      - deploy/requirements-*.txt
      - faster_qwen3_tts/**
      - streaming_service/**
      - pyproject.toml
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'xiaoqiqiya/faster-qwen3-tts'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, gateway]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check deployment configuration
        run: |
          docker compose -f compose.yaml config --format json > /tmp/tts-source.json
          docker compose -f compose.images.yaml config --format json > /tmp/tts-images.json
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('/tmp/tts-source.json').read_text())
          images = json.loads(Path('/tmp/tts-images.json').read_text())
          assert source['services'].keys() == images['services'].keys()
          for name, config in source['services'].items():
              runtime = {key: value for key, value in images['services'][name].items() if key != 'image'}
              assert runtime == {key: value for key, value in config.items() if key != 'build'}, name
          PY
      - name: Free space for CUDA image
        if: matrix.service == 'backend'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - name: Build and publish commit image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tts-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=tts-${{ matrix.service }}

  publish-latest:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest after both builds succeed
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in backend gateway; do
            docker buildx imagetools create \
              --tag "$prefix-$service:latest" \
              "$prefix-$service:sha-$GITHUB_SHA"
          done
          {
            echo 'Both images were built from the same source commit.'
            echo '```dotenv'
            echo "TTS_IMAGE_TAG=sha-$GITHUB_SHA"
            echo '```'
            echo 'Deploy: docker compose -f compose.images.yaml pull'
            echo 'Start: docker compose -f compose.images.yaml up -d'
          } >> "$GITHUB_STEP_SUMMARY"
