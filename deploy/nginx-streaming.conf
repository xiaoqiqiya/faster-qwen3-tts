# Include this location in an existing server block; adjust upstream to your TTS service.
location ~ ^/(v1/audio/speech|v1/audio/speech/sse)$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 150s;
    proxy_send_timeout 15s;
    send_timeout 15s;
}
